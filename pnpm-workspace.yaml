packages:
  - packages/*
  - apps/*

allowBuilds:
  "@nestjs/core": true
  "@scarf/scarf": true
  "@swc/core": true
  aws-sdk: true
  bufferutil: true
  chacha-native: false
  core-js: true
  core-js-pure: true
  esbuild: true
  node-datachannel: true
  nx: true
  unrs-resolver: true
  utf-8-validate: true
  utp-native: true

ignoredBuiltDependencies:
  - "@nestjs/core"
  - "@scarf/scarf"
  - "@swc/core"
  - nx
  - sqlite3
  - unrs-resolver
# Explicitly allow postinstall/build scripts for packages with required native/runtime artifacts.
# This keeps pnpm's build-script policy locked down while still letting AWS/storage test deps work.
onlyBuiltDependencies:
  - aws-sdk
  - bufferutil
  - core-js
  - core-js-pure
  - esbuild
  - node-datachannel
  - utf-8-validate
  - utp-native
